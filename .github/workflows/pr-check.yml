name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  backend-quick:
    name: Backend Quick Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint backend quick scope
        run: ruff check backend/ai_workbench backend/tests/test_cli.py

      - name: Run backend quick tests
        working-directory: backend
        run: pytest tests/test_cli.py tests/test_api.py tests/test_profiler.py tests/test_anomaly.py

  frontend-quick:
    name: Frontend Quick Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
